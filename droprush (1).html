<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>DropRush: симулятор кейсов</title>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#0a0714;--pn:#14102a;--ln:#2a2250;--tx:#ece8ff;--mu:#8f86b8;--n1:#00f0ff;--n2:#ff2bd6;--ok:#2dff9a;--bad:#ff5470;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:#05040c;color:var(--tx);font:15px/1.5 Manrope,system-ui,sans-serif;min-height:100vh;background-image:
radial-gradient(ellipse 100% 80% at 50% -30%,#2d1b69 0%,transparent 55%),
radial-gradient(ellipse 60% 50% at 100% 0%,#0d3a5c55 0%,transparent 50%),
radial-gradient(ellipse 50% 40% at 0% 100%,#4a156055 0%,transparent 50%),
radial-gradient(circle at 75% 70%,#ff2bd618 0%,transparent 35%),
radial-gradient(circle at 15% 40%,#00f0ff14 0%,transparent 30%),
repeating-linear-gradient(0deg,transparent,transparent 80px,#ffffff03 80px,#ffffff03 81px),
repeating-linear-gradient(90deg,transparent,transparent 80px,#ffffff03 80px,#ffffff03 81px),
linear-gradient(165deg,#0a0818 0%,#07060f 40%,#0c0918 100%);
background-attachment:fixed}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;gap:16px;align-items:center;flex-wrap:wrap;padding:12px 20px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--ln)}
.logo{font:800 22px Unbounded,sans-serif;background:linear-gradient(90deg,var(--n1),var(--n2));-webkit-background-clip:text;background-clip:text;color:transparent}
nav{display:flex;gap:6px;flex-wrap:wrap;flex:1}
button{font:inherit;color:inherit;cursor:pointer}
nav button,.btn{background:var(--pn);border:1px solid var(--ln);border-radius:10px;padding:8px 14px;font-weight:600}
nav button.on{border-color:var(--n1);color:var(--n1);box-shadow:0 0 14px #00f0ff44}
.btn.go{background:linear-gradient(90deg,var(--n1),var(--n2));color:#0a0714;border:0;font-weight:700}
.btn:disabled{opacity:.4;cursor:not-allowed}
button:focus-visible{outline:2px solid var(--n1);outline-offset:2px}
.bal{font:600 16px Unbounded,sans-serif;color:var(--ok)}
main{max-width:1100px;margin:0 auto;padding:22px 20px 60px}
h2{font:800 24px Unbounded,sans-serif;margin:0 0 6px}
.mu{color:var(--mu);margin:0 0 18px}
.cases{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px;margin-top:18px}
.case{position:relative;background:linear-gradient(180deg,color-mix(in srgb,hsl(var(--h) 55% 22%) 55%,#14101f),#0c0a14 75%);
border:1px solid color-mix(in srgb,hsl(var(--h) 80% 50%) 40%,#2a2250);border-radius:16px;padding:0;text-align:center;overflow:hidden;
transition:transform .2s,box-shadow .2s,border-color .2s;cursor:pointer;display:flex;flex-direction:column}
.case:hover{transform:translateY(-5px) scale(1.02);border-color:hsl(var(--h) 100% 58%);
box-shadow:0 14px 36px hsl(var(--h) 90% 40%/.4),0 0 0 1px hsl(var(--h) 80% 55%/.25),inset 0 1px 0 #ffffff22}
.case-art{height:130px;display:grid;place-items:center;padding:12px;position:relative;
background:radial-gradient(ellipse 70% 60% at 50% 40%,hsl(var(--h) 90% 45%/.3),transparent 70%),
linear-gradient(180deg,hsl(var(--h) 40% 12%/.5),transparent);
border-bottom:1px solid color-mix(in srgb,hsl(var(--h) 60% 40%) 25%,transparent)}
.case-art svg{width:88px;height:88px;filter:drop-shadow(0 6px 14px hsl(var(--h) 100% 50%/.45));transition:transform .25s}
.case:hover .case-art svg{transform:scale(1.08) translateY(-3px)}
.case-body{padding:10px 12px 12px;text-align:left}
.case h3{margin:0 0 2px;font:800 14px Unbounded,sans-serif;color:var(--tx);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.case-price{font:800 18px Unbounded,sans-serif;background:linear-gradient(90deg,hsl(var(--h) 100% 72%),hsl(calc(var(--h)+35) 100% 62%));-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:6px}
.case-bot{display:flex;justify-content:space-between;align-items:center;gap:6px;flex-wrap:wrap}
.case-tag{font-size:10px;color:hsl(var(--h) 90% 75%);background:color-mix(in srgb,hsl(var(--h) 70% 40%) 20%,#14101f);border:1px solid color-mix(in srgb,hsl(var(--h) 60% 50%) 30%,#2a2250);border-radius:999px;padding:2px 8px;font-weight:600}
.case-glow{position:absolute;top:-20%;left:50%;transform:translateX(-50%);width:100px;height:80px;border-radius:50%;background:radial-gradient(circle,hsl(var(--h) 100% 55%/.35),transparent 70%);pointer-events:none;filter:blur(4px)}
.case-top{display:none}
.stage{position:relative;overflow:hidden;background:var(--pn);border:1px solid var(--ln);border-radius:16px;height:150px}
.stage:after{content:"";position:absolute;left:50%;top:0;bottom:0;width:3px;background:var(--n1);box-shadow:0 0 14px var(--n1);z-index:2}
.track{position:absolute;left:0;top:14px;display:flex;gap:8px;will-change:transform}
.sk{flex:0 0 122px;height:122px;border-radius:12px;background:linear-gradient(180deg,color-mix(in srgb,var(--c) 22%,var(--pn)),var(--pn));border:1px solid var(--c);display:flex;flex-direction:column;justify-content:flex-end;align-items:stretch;padding:6px 8px 8px;font-size:11px;overflow:hidden}
.sk b{font-weight:700;line-height:1.2}.sk span{color:var(--mu)}.sk i{flex:1}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin:14px 0}
.grid .sk{flex:none;width:100%;height:120px;cursor:pointer;text-align:left}
.sk.on{outline:3px solid var(--n1);box-shadow:0 0 18px #00f0ff66}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:12px 0}
.res{margin-top:16px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.res .sk{width:150px;flex:none}
.bar{position:relative;height:22px;border-radius:11px;background:var(--bad);overflow:hidden;margin:14px 0}
.bar .z{position:absolute;left:0;top:0;bottom:0;background:var(--ok)}
.bar .nd{position:absolute;top:-2px;bottom:-2px;width:4px;background:#fff;left:0;transition:left 2s cubic-bezier(.2,.8,.2,1)}
table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid var(--ln);text-align:left}
input{font:inherit;background:var(--pn);color:var(--tx);border:1px solid var(--ln);border-radius:8px;padding:8px;width:120px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--pn);border:1px solid var(--n2);border-radius:10px;padding:10px 16px;display:none;z-index:9}
.win{color:var(--ok)}.lose{color:var(--bad)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
.ic{flex:1;min-height:48px;width:100%;height:auto;max-height:72px;object-fit:contain;object-position:center;filter:drop-shadow(0 0 6px color-mix(in srgb,var(--c) 50%,transparent));pointer-events:none}.sk.big .ic{max-height:110px;min-height:80px}.stage.mini .ic{max-height:36px;min-height:28px}

#ov{position:fixed;inset:0;z-index:8;background:#06040f;display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto}.ovb{width:min(900px,100%)}
.stage{height:160px}.sk.big{width:190px;height:190px;box-shadow:0 0 40px var(--c)}.pop{animation:pop .6s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.3);opacity:0}}
.stage+.stage{margin-top:8px}.stage.mini{height:100px}.stage.mini .track{top:10px}.stage.mini .sk{flex:0 0 76px;height:78px;font-size:9px;padding:3px 4px}.stage.mini .ic{display:block;max-height:36px}
.grid.mini{grid-template-columns:repeat(auto-fill,minmax(110px,1fr))}.grid.mini .sk{height:100px;font-size:10px;cursor:default}
#ov{align-items:flex-start}.ovb{margin:0 auto;padding:24px 0 30px}
.x{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:16px;z-index:9;width:44px;height:44px;border-radius:50%;background:var(--pn);border:1px solid var(--ln);font-size:20px}
.rev{position:relative;text-align:center;width:100%;padding:10px 0}.rev>*{position:relative;z-index:1}
.rev>.burst{pointer-events:none;position:absolute;left:50%;top:38%;width:460px;height:460px;margin:-230px 0 0 -230px;border-radius:50%;background:repeating-conic-gradient(var(--c) 0 6deg,transparent 6deg 18deg);opacity:.28;-webkit-mask:radial-gradient(circle,#000 15%,transparent 68%);mask:radial-gradient(circle,#000 15%,transparent 68%);animation:spn 10s linear infinite;z-index:0}
@keyframes spn{to{transform:rotate(360deg)}}
.rv{justify-content:center}.rv>div{animation:flip .8s both;animation-delay:calc(var(--d)*.25s + .2s)}.rv .sk{margin:auto}
.flash{position:fixed;inset:0;background:radial-gradient(circle,var(--c),transparent 70%);pointer-events:none;animation:fl .9s forwards}
@keyframes fl{from{opacity:.85}to{opacity:0}}
.hit{position:relative;z-index:3;animation:hit 1.4s ease-in-out forwards}
@keyframes hit{0%{transform:scale(1)}35%{transform:scale(1.14);box-shadow:0 0 34px var(--c);filter:brightness(1.5)}100%{transform:scale(1.12);box-shadow:0 0 46px var(--c);filter:brightness(1.2)}}
@keyframes flip{from{transform:perspective(700px) rotateY(90deg) scale(.4);opacity:0}65%{transform:perspective(700px) rotateY(-12deg) scale(1.12);opacity:1}to{transform:none;opacity:1}}
.nm{font:800 22px Unbounded,sans-serif;color:var(--c);text-shadow:0 0 18px var(--c);margin:6px 0 10px;animation:flip .8s both}
.rev h3{font:800 18px Unbounded,sans-serif;text-shadow:0 0 14px var(--c)}
.grid.rv{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}.rv>div{width:150px}.rv>div:only-child{width:200px}
#ob,.res{position:relative;z-index:2}.flash,.burst{pointer-events:none}
#wh{overflow:visible;transition:filter .5s}#wh.won{filter:drop-shadow(0 0 18px var(--ok))}#wh.lost{filter:drop-shadow(0 0 18px var(--bad))}#nd path{fill:#fff;filter:drop-shadow(0 0 6px var(--n1))}.wt{font:800 30px Unbounded,sans-serif;fill:var(--tx)}.ws{font:600 11px Manrope,sans-serif;fill:var(--mu)}
input[type=range]{width:min(320px,100%);padding:0;accent-color:var(--n1)}#cin{width:80px}
.hi{background:var(--pn);border:1px solid var(--ln);border-radius:12px;padding:12px 14px;margin:8px 0}.hh{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}.pl{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.pill{border:1px solid var(--c);border-radius:999px;padding:2px 10px;font-size:12px;background:color-mix(in srgb,var(--c) 18%,var(--pn))}
.pf{display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin:14px 0}.av{width:88px;height:88px;border-radius:50%;display:grid;place-items:center;font:800 36px Unbounded,sans-serif;color:#0a0714;background:linear-gradient(135deg,hsl(var(--h) 100% 60%),hsl(calc(var(--h) + 60) 100% 60%));box-shadow:0 0 24px hsl(var(--h) 100% 60%/.5)}
.bar2{height:10px;border-radius:5px;background:var(--ln);margin:6px 0;overflow:hidden}.bar2 i{display:block;height:100%;background:linear-gradient(90deg,var(--n1),var(--n2))}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px;margin:14px 0}.stt{background:var(--pn);border:1px solid var(--ln);border-radius:12px;padding:12px}.stt span{display:block;color:var(--mu);font-size:13px}.stt b{font:700 18px Unbounded,sans-serif}#nick{width:200px}#nkb{font-weight:600}

/* === Upgrade 2.0 === */
.up-wrap{max-width:1100px;margin:0 auto}
.up-title{font:800 22px Unbounded,sans-serif;text-align:center;letter-spacing:.04em;margin:0 0 18px;background:linear-gradient(90deg,var(--n1),var(--n2));-webkit-background-clip:text;background-clip:text;color:transparent}
.up-row{display:grid;grid-template-columns:1fr minmax(220px,280px) 1fr;gap:14px;align-items:stretch}
@media(max-width:860px){.up-row{grid-template-columns:1fr}}
.up-panel{background:var(--pn);border:1px solid var(--ln);border-radius:16px;padding:14px;min-height:220px;display:flex;flex-direction:column}
.up-panel h3{margin:0 0 10px;font:700 13px Manrope,sans-serif;color:var(--mu);font-weight:600;text-align:center}
.up-slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;flex:1}
.up-slot{background:#0d0a1a;border:1px dashed var(--ln);border-radius:12px;min-height:90px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;cursor:pointer}
.up-slot .sk{width:100%;height:100%;border:0;background:transparent;padding:4px;font-size:10px}
.up-slot.empty{opacity:.55}
.up-slot .rm{position:absolute;top:4px;right:4px;width:22px;height:22px;border-radius:50%;background:#ff5470;border:0;color:#fff;font-size:12px;line-height:22px;padding:0;z-index:2;display:none}
.up-slot:not(.empty) .rm{display:block}
.up-center{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
.up-gauge{position:relative;width:220px;height:220px}
.up-gauge svg{width:100%;height:100%;overflow:visible}
.up-gauge .gbg{fill:none;stroke:#1a1530;stroke-width:14}
.up-gauge .gring{fill:none;stroke:url(#upGrad);stroke-width:14;stroke-linecap:round;transform:rotate(-90deg);transform-origin:110px 110px;transition:stroke-dasharray .35s}
.up-gauge .gmark{fill:var(--mu);font:600 10px Manrope,sans-serif}
.up-gauge .gval{fill:var(--tx);font:800 28px Unbounded,sans-serif}
.up-gauge .gsub{fill:var(--mu);font:600 11px Manrope,sans-serif}
.up-gauge.won{filter:drop-shadow(0 0 18px var(--ok))}
.up-gauge.lost{filter:drop-shadow(0 0 18px var(--bad))}
.up-target{flex:1;display:flex;align-items:center;justify-content:center}
.up-target .sk{width:160px;height:150px;cursor:default}
.up-target.empty-t{opacity:.4;text-align:center;color:var(--mu);font-size:13px;padding:20px}
.up-controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center;margin:16px 0 8px}
.up-balbox{display:flex;align-items:center;gap:8px;background:var(--pn);border:1px solid var(--ln);border-radius:12px;padding:8px 12px}
.up-balbox input[type=range]{width:140px}
.up-presets{display:flex;gap:6px;flex-wrap:wrap}
.up-presets .btn{padding:6px 12px;font-size:13px}
.up-go{font:700 15px Unbounded,sans-serif;padding:12px 28px;border-radius:12px;letter-spacing:.03em}
.up-info{text-align:center;color:var(--mu);font-size:13px;margin:4px 0 12px}
.up-bot{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:8px}
@media(max-width:700px){.up-bot{grid-template-columns:1fr}}
.up-bot-panel{background:var(--pn);border:1px solid var(--ln);border-radius:14px;padding:12px}
.up-bot-panel h4{margin:0 0 8px;font:700 14px Unbounded,sans-serif}
.up-bot .grid{margin:0;max-height:280px;overflow:auto;grid-template-columns:repeat(auto-fill,minmax(110px,1fr))}
.up-bot .grid .sk{height:100px;font-size:10px}
.up-bot .grid .sk.on{outline:2px solid var(--n1)}
.up-filters{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.up-filters input{width:70px;padding:5px 8px;font-size:12px}
.up-filters select{background:var(--pn);color:var(--tx);border:1px solid var(--ln);border-radius:8px;padding:5px 8px;font:inherit}
#ur{margin-top:12px;text-align:center}


/* ===== Mobile ===== */
html,body{overflow-x:hidden;-webkit-tap-highlight-color:transparent}
button,.btn,nav button,.case,.sk{touch-action:manipulation;-webkit-user-select:none;user-select:none}
@media(max-width:720px){
  header{padding:8px 10px;gap:8px;row-gap:6px}
  .logo{font-size:17px}
  nav{order:3;flex:1 1 100%;gap:4px;overflow-x:auto;flex-wrap:nowrap;padding-bottom:2px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  nav::-webkit-scrollbar{display:none}
  nav button{flex:0 0 auto;padding:8px 12px;font-size:13px;white-space:nowrap;min-height:40px}
  .bal{font-size:14px;margin-left:auto}
  #nkb{font-size:12px;max-width:90px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  header .btn{padding:7px 10px;font-size:12px;min-height:40px}
  main{padding:12px 10px 80px}
  h2{font-size:18px}
  .mu{font-size:13px;margin-bottom:12px}
  .cases{grid-template-columns:repeat(2,1fr);gap:10px;margin-top:12px}.case-art{height:100px}.case-art svg{width:70px;height:70px}.case h3{font-size:12px}.case-price{font-size:15px}
  .case .case-top{padding:12px 12px 6px;gap:10px}
  .case .case-ico{width:48px;height:48px;border-radius:12px}
  .case .case-ico svg{width:28px;height:22px}
  .case h3{font-size:14px}
  .case .case-price{font-size:15px}
  .case .case-bot{padding:8px 12px 12px;flex-wrap:wrap}
  .case .case-tag{font-size:10px;padding:2px 8px}
  .stage{height:130px;border-radius:12px}
  .stage:after{width:2px}
  .track{top:10px;gap:6px}
  .sk{flex:0 0 100px;height:108px;font-size:10px;padding:4px 6px;border-radius:10px}
  .ic{max-height:56px;min-height:36px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px}
  .grid .sk{height:100px}
  .sk.big{width:150px;height:150px}
  .sk.big .ic{max-height:90px;min-height:60px}
  .row{gap:8px;margin:10px 0}
  .btn{min-height:42px;padding:10px 14px}
  .btn.go{min-height:44px}
  #ov{padding:8px;align-items:flex-start;justify-content:flex-start;padding-top:calc(8px + env(safe-area-inset-top,0px))}#ov.roll-ov{padding:0;padding-top:env(safe-area-inset-top,0px)}
  .ovb{width:100%;padding:48px 0 24px}
  .x{top:calc(8px + env(safe-area-inset-top,0px));right:10px;width:40px;height:40px}
  .stage.mini{height:88px}
  .stage.mini .sk{flex:0 0 64px;height:68px;font-size:8px}
  .stage.mini .ic{max-height:28px}
  .grid.rv>div{width:120px}
  .rv>div:only-child{width:160px}
  .nm{font-size:16px}
  .rev h3{font-size:15px}
  .stats{grid-template-columns:1fr 1fr;gap:8px}
  .stt{padding:10px}
  .stt b{font-size:15px}
  .pf{gap:12px}
  .av{width:64px;height:64px;font-size:26px}
  #nick{width:100%;max-width:220px}
  .up-title{font-size:15px;margin-bottom:12px}
  .up-row{gap:10px}
  .up-panel{min-height:160px;padding:10px;border-radius:12px}
  .up-panel h3{font-size:12px}
  .up-slots{grid-template-columns:repeat(3,1fr);gap:6px}
  .up-slot{min-height:72px;border-radius:10px}
  .up-gauge{width:min(200px,70vw);height:min(200px,70vw)}
  .up-target .sk{width:130px;height:120px}
  .up-controls{flex-direction:column;gap:8px}
  .up-balbox{width:100%;justify-content:space-between}
  .up-balbox input[type=range]{flex:1;width:auto;min-width:0}
  .up-go{width:100%;padding:14px;font-size:14px}
  .up-presets{width:100%;justify-content:center}
  .up-bot{gap:10px}
  .up-bot .grid{max-height:220px;grid-template-columns:repeat(auto-fill,minmax(90px,1fr))}
  .up-bot .grid .sk{height:88px;font-size:9px}
  .up-filters input{width:60px}
  .hi{padding:10px}
  table{font-size:13px}
  td,th{padding:6px}
  #toast{left:12px;right:12px;transform:none;bottom:calc(12px + env(safe-area-inset-bottom,0px));text-align:center;font-size:13px}
  input[type=range]{width:100%}
}
@media(max-width:400px){
  .cases{grid-template-columns:1fr}
  .case h3{font-size:15px}
  .logo{font-size:15px}
  nav button{padding:7px 10px;font-size:12px}
}
@media(max-width:860px){
  .up-center{order:-1}
}


/* ===== Case open roulette (like CS sites) ===== */
#ov.roll-ov{background:#0a0c1a;background-image:radial-gradient(ellipse 80% 60% at 50% 20%,#1a1040aa,transparent),radial-gradient(circle at 20% 80%,#0a204040,transparent);padding:0;padding-top:env(safe-area-inset-top,0px);align-items:flex-start;justify-content:flex-start;overflow-x:hidden;overflow-y:auto}
#ov.roll-ov .ovb{width:100%;max-width:100%;margin:0;padding:12px 0 40px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start}
.roll-title{font:800 28px Unbounded,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:#fff;text-align:center;margin:8px 0 4px;text-shadow:0 0 24px #7c5cff66}
.roll-sub{color:#8b85b0;font-size:13px;margin-bottom:18px;display:flex;align-items:center;gap:6px}
.roll-wrap{position:relative;width:100%;max-width:980px;padding:0 20px;margin:0 auto}
.roll-frame{position:relative;height:200px;display:flex;align-items:center}
.roll-stage{position:relative;flex:1;height:180px;overflow:hidden;border-radius:4px;
  mask-image:linear-gradient(90deg,transparent 0%,#000 8%,#000 92%,transparent 100%);
  -webkit-mask-image:linear-gradient(90deg,transparent 0%,#000 8%,#000 92%,transparent 100%)}
.roll-track{position:absolute;left:0;top:50%;transform:translateY(-50%);display:flex;gap:10px;will-change:transform}
.roll-card{flex:0 0 140px;width:140px;height:160px;border-radius:14px;background:linear-gradient(180deg,#c44b8a 0%,#6b2d7a 45%,#3d1a55 100%);
  border:1px solid #e879b833;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:8px 6px 10px;
  box-shadow:inset 0 0 30px #ff2bd622,0 4px 16px #0006;position:relative;overflow:hidden}
.roll-card::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(-45deg,transparent,transparent 8px,#ffffff06 8px,#ffffff06 16px);pointer-events:none}
.roll-card img{flex:1;width:90%;max-height:95px;object-fit:contain;filter:drop-shadow(0 4px 8px #0008);position:relative;z-index:1}
.roll-card .rn{font-size:10px;color:#e8d0ffcc;text-align:center;line-height:1.2;position:relative;z-index:1;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.roll-card .rp{font-size:11px;color:#fff;font-weight:700;position:relative;z-index:1}
.roll-card.r0{background:linear-gradient(180deg,#5a6578 0%,#2a3040 100%)}
.roll-card.r1{background:linear-gradient(180deg,#3b7dd6 0%,#1a3a6e 100%)}
.roll-card.r2{background:linear-gradient(180deg,#9b4dff 0%,#4a1a8a 100%)}
.roll-card.r3{background:linear-gradient(180deg,#ff4db8 0%,#8a1a5a 100%)}
.roll-card.r4{background:linear-gradient(180deg,#ffc44d 0%,#8a5a10 100%);border-color:#ffc44d55}
.roll-card.hit{transform:scale(1.06);box-shadow:0 0 28px #ff2bd6aa,inset 0 0 20px #fff2;z-index:2}
.roll-bracket{position:absolute;top:50%;width:28px;height:160px;transform:translateY(-50%);z-index:3;pointer-events:none}
.roll-bracket.left{left:4px;border:3px solid #ff9f1a;border-right:none;border-radius:18px 0 0 18px;box-shadow:0 0 16px #ff9f1a88,-4px 0 20px #ff9f1a44}
.roll-bracket.right{right:4px;border:3px solid #00e5ff;border-left:none;border-radius:0 18px 18px 0;box-shadow:0 0 16px #00e5ff88,4px 0 20px #00e5ff44}
.roll-marker{position:absolute;left:50%;z-index:4;transform:translateX(-50%);width:0;height:0;border-left:10px solid transparent;border-right:10px solid transparent;filter:drop-shadow(0 0 6px #ff9f1a)}
.roll-marker.top{top:-2px;border-top:14px solid #ff9f1a}
.roll-marker.bot{bottom:-2px;border-bottom:14px solid #ff9f1a}
.roll-status{margin-top:22px;padding:12px 28px;border-radius:12px;background:#1a1630;border:1px solid #2a2550;color:#a89cc8;font:700 13px Unbounded,sans-serif;letter-spacing:.06em}
.roll-actions{margin-top:16px;display:flex;flex-wrap:wrap;gap:10px;justify-content:center;padding:0 16px}
.roll-multi .roll-frame{height:120px}
.roll-multi .roll-stage{height:110px}
.roll-multi .roll-card{flex:0 0 90px;width:90px;height:100px;padding:4px}
.roll-multi .roll-card img{max-height:55px}
.roll-multi .roll-card .rn{font-size:8px}
.roll-multi .roll-bracket{height:100px;width:18px}
@media(max-width:720px){
  .roll-title{font-size:20px}
  .roll-frame{height:160px}
  .roll-stage{height:145px}
  .roll-card{flex:0 0 110px;width:110px;height:130px}
  .roll-card img{max-height:70px}
  .roll-bracket{height:130px;width:20px}
  .roll-wrap{padding:0 8px}
}


body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
background:
radial-gradient(circle 280px at 20% 30%,#7c3aed18,transparent),
radial-gradient(circle 320px at 80% 60%,#06b6d418,transparent),
radial-gradient(circle 200px at 60% 20%,#ec489918,transparent);
animation:none}
@keyframes bgPulse{from{opacity:.7;filter:hue-rotate(0deg)}to{opacity:1;filter:hue-rotate(25deg)}}
header,main,#toast{position:relative;z-index:1}
header{z-index:5}#toast{z-index:9}
#ov{position:fixed!important;inset:0!important;z-index:100!important;align-items:flex-start!important;justify-content:flex-start!important}


/* ===== Case detail page ===== */
.cd{max-width:960px;margin:0 auto}
.cd-head{display:flex;flex-wrap:wrap;gap:16px;align-items:center;margin-bottom:18px}
.cd-back{background:var(--pn);border:1px solid var(--ln);border-radius:10px;padding:8px 14px;font-weight:600;cursor:pointer}
.cd-back:hover{border-color:var(--n1);color:var(--n1)}
.cd-hero{display:flex;gap:20px;align-items:center;flex-wrap:wrap;background:linear-gradient(135deg,color-mix(in srgb,hsl(var(--h) 50% 20%) 50%,#120e24),#0e0b1a);
border:1px solid color-mix(in srgb,hsl(var(--h) 70% 45%) 40%,var(--ln));border-radius:20px;padding:20px;margin-bottom:20px;position:relative;overflow:hidden}
.cd-hero::after{content:"";position:absolute;right:-30px;top:-30px;width:160px;height:160px;border-radius:50%;background:radial-gradient(circle,hsl(var(--h) 100% 55%/.25),transparent 70%);pointer-events:none}
.cd-ico{width:88px;height:88px;border-radius:18px;background:radial-gradient(circle at 30% 30%,hsl(var(--h) 90% 50%/.4),hsl(var(--h) 40% 12%));border:1px solid hsl(var(--h) 60% 40%/.5);display:grid;place-items:center;flex-shrink:0}
.cd-name{font:800 26px Unbounded,sans-serif;margin:0 0 4px}
.cd-price{font:800 28px Unbounded,sans-serif;background:linear-gradient(90deg,hsl(var(--h) 100% 70%),hsl(calc(var(--h)+40) 100% 65%));-webkit-background-clip:text;background-clip:text;color:transparent}
.cd-meta{color:var(--mu);font-size:13px;margin-top:4px}
.cd-actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:16px 0}
.cd-qty{display:flex;gap:6px;flex-wrap:wrap}
.cd-qty .btn{min-width:44px}
.cd-sec{margin:22px 0 8px;font:800 16px Unbounded,sans-serif}
.cd-rarity{margin:14px 0 6px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.cd-rarity .pill{border-radius:999px;padding:3px 12px;font-size:12px;font-weight:700;border:1px solid}
.cd-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;margin-bottom:8px}
.cd-grid .sk{height:115px;cursor:default;font-size:10px}
@media(max-width:720px){
  .cd-name{font-size:20px}.cd-price{font-size:22px}.cd-ico{width:64px;height:64px}
  .cd-hero{padding:14px;gap:12px}.cd-grid{grid-template-columns:repeat(auto-fill,minmax(100px,1fr))}
}


#ov{position:fixed!important;inset:0!important;z-index:100!important;display:flex!important;align-items:flex-start!important;justify-content:flex-start!important;overflow:auto!important}
#ov.roll-ov{align-items:flex-start!important;justify-content:flex-start!important;padding-top:env(safe-area-inset-top,0px)!important}
#ov.roll-ov .ovb{margin:0!important;margin-top:0!important;padding-top:8px!important;min-height:auto!important}
#ov .x{position:fixed!important;top:calc(10px + env(safe-area-inset-top,0px))!important;right:12px!important;z-index:101!important}


.case-art img.case-img{width:110px;height:110px;object-fit:contain;filter:drop-shadow(0 8px 20px hsl(var(--h) 100% 50%/.5));transition:transform .25s}
.case:hover .case-art img.case-img{transform:scale(1.1) translateY(-4px)}
.case-img-fallback{width:90px;height:90px;border-radius:16px;background:radial-gradient(circle at 30% 30%,hsl(var(--h) 90% 55%),hsl(var(--h) 50% 20%))}
.odds-card{position:relative}
.odds-pct{display:block!important;color:var(--n1)!important;font-weight:700!important;font-size:11px!important;margin-top:2px}
.cd-grid .sk{height:128px}
.cases-filter{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 4px;align-items:center}
.cases-filter .btn.on{border-color:var(--n1);color:var(--n1)}
.live-feed{display:flex;gap:8px;overflow-x:auto;padding:8px 0 12px;scrollbar-width:none;mask-image:linear-gradient(90deg,transparent,#000 4%,#000 96%,transparent)}
.live-feed::-webkit-scrollbar{display:none}
.live-item{flex:0 0 auto;display:flex;align-items:center;gap:8px;background:var(--pn);border:1px solid var(--ln);border-radius:10px;padding:6px 10px;font-size:12px}
.live-item img{width:36px;height:36px;object-fit:contain}
.live-item b{color:var(--c)}


.case-art svg{width:100px;height:100px;filter:drop-shadow(0 8px 18px hsl(var(--h) 90% 45%/.45));transition:transform .25s}
.case:hover .case-art svg{transform:scale(1.08) translateY(-4px)}
.cd-ico svg{width:90px;height:90px}

/* Case grid - GGDrop style */
.page-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:8px}
.page-head h2{margin:0}
.fast-tog{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mu);cursor:pointer;user-select:none}
.fast-tog input{width:16px;height:16px;accent-color:var(--n1)}
.cases{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:16px;margin-top:14px}
.case{position:relative;background:#12131a;border:1px solid #1e2030;border-radius:14px;overflow:hidden;padding:0;transition:border-color .15s,transform .15s,box-shadow .15s}
.case:hover{border-color:#3a3f5c;transform:translateY(-3px);box-shadow:0 12px 28px #0008}
.case-main{display:block;width:100%;background:none;border:none;padding:0;color:inherit;text-align:center;cursor:pointer;font:inherit}
.case-art{position:relative;height:168px;background:radial-gradient(ellipse 80% 70% at 50% 60%,hsl(var(--h) 45% 18%),#0a0b10 75%);display:flex;align-items:flex-end;justify-content:center;overflow:hidden}
.case-stage{position:relative;width:100%;height:140px}
.case-skin{position:absolute;bottom:8px;width:72px;height:72px;object-fit:contain;filter:drop-shadow(0 4px 10px #000a);transition:transform .2s}
.case-skin.s0{left:50%;transform:translateX(-50%) scale(1.15);z-index:3;width:88px;height:88px}
.case-skin.s1{left:12%;transform:rotate(-12deg);z-index:2;opacity:.9}
.case-skin.s2{right:12%;left:auto;transform:rotate(12deg);z-index:2;opacity:.9}
.case:hover .case-skin.s0{transform:translateX(-50%) scale(1.22) translateY(-4px)}
.case-opens{position:absolute;top:10px;left:10px;background:#0e0f16cc;border:1px solid #2a2e42;border-radius:8px;padding:3px 8px;font-size:11px;color:#9aa3b8;font-weight:600}
.fav-btn{position:absolute;top:8px;right:8px;z-index:5;width:32px;height:32px;border-radius:8px;border:1px solid #2a2e42;background:#0e0f16cc;color:#6b7280;font-size:16px;cursor:pointer;display:grid;place-items:center;padding:0}
.fav-btn:hover,.fav-btn.on{color:#fbbf24;border-color:#fbbf2466}
.case-body{padding:10px 12px 14px}
.case-body h3{margin:0 0 8px;font:700 14px/1.2 Unbounded,sans-serif;color:#e8eaf0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.case-price-btn{display:inline-block;background:linear-gradient(180deg,#f0b429,#d4920a);color:#1a1000;font:800 14px Unbounded,sans-serif;padding:7px 18px;border-radius:10px;box-shadow:0 2px 0 #a37008,0 4px 12px #f0b42933}
.case:hover .case-price-btn{filter:brightness(1.08)}
/* inventory+profile */
.inv-prof{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start;background:#12131a;border:1px solid #1e2030;border-radius:14px;padding:16px;margin-bottom:16px}
.ip-left{display:flex;gap:12px;align-items:center}
.ip-left input{background:#0a0b10;border:1px solid #2a2e42;border-radius:8px;padding:8px 10px;color:var(--tx);width:140px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(90px,1fr));gap:8px;flex:1}
.stt{background:#0a0b10;border:1px solid #1e2030;border-radius:10px;padding:10px}
.stt b{display:block;font:700 15px Unbounded,sans-serif;margin-top:2px}
/* tone down AI glow excess */
.case-glow{display:none}
body::before{opacity:.45}
@media(max-width:720px){
  .cases{grid-template-columns:repeat(2,1fr);gap:10px}
  .case-art{height:130px}
  .case-skin.s0{width:70px;height:70px}
  .case-skin{width:52px;height:52px}
  .stats{grid-template-columns:repeat(2,1fr)}
}


.speed-tog{display:inline-flex;background:#0e0f16;border:1px solid #2a2e42;border-radius:10px;padding:3px;gap:2px}
.speed-tog button{border:none;background:transparent;color:#8b93a7;padding:7px 14px;border-radius:8px;font:600 12px Unbounded,sans-serif;cursor:pointer;transition:background .15s,color .15s}
.speed-tog button.on{background:#1e2438;color:#fff}
.speed-tog button:hover{color:#c8cdd8}

function poolOf(c,k){
  const floor=c._floor||0;
  const gun=i=>!c.g||c.g.includes(S[i][3]);
  let p=S.map((s,i)=>i).filter(i=>S[i][2]==k&&gun(i)&&(S[i][1]>=floor||floor<=0));
  if(!p.length&&floor>0)p=S.map((s,i)=>i).filter(i=>gun(i)&&S[i][1]>=floor);
  if(!p.length&&floor>0)p=S.map((s,i)=>i).filter(i=>S[i][2]==k&&S[i][1]>=floor);
  if(!p.length&&floor>0)p=S.map((s,i)=>i).filter(i=>S[i][1]>=floor);
  if(!p.length){
    p=S.map((s,i)=>i).filter(i=>S[i][2]==k&&gun(i));
    if(!p.length)p=S.map((s,i)=>i).filter(i=>S[i][2]==k);
    if(!p.length)p=S.map((s,i)=>i);
  }
  // Разнообразие: в дорогих кейсах меньше скинов, у каждого кейса свой набор
  const maxN = c.p<5 ? 16 : c.p<15 ? 12 : c.p<50 ? 9 : c.p<150 ? 8 : c.p<500 ? 7 : 6;
  if(p.length>maxN){
    const seed=[...(c.n||"x")].reduce((a,ch)=>a+ch.charCodeAt(0),k*19+Math.round(c.p*3));
    // стабильный «рандом» от названия кейса — разные кейсы = разные скины
    p=p.slice().sort((a,b)=>((a*131+seed)%1009)-((b*131+seed)%1009));
    // чуть подмешиваем дорогие/дешёвые: берём maxN из перемешанного
    p=p.slice(0,maxN);
  }
  return p;
}

function strip(tr,c,win){

let land;
if(win){
  // random point inside win sector (avoid exact edges)
  land=5+Math.random()*Math.max(1,winArc-10);
}else{
  land=winArc+5+Math.random()*Math.max(1,360-winArc-10);
}
const spins=4+R(3); // 4-6 full turns
const totA=spins*360+land,D=(+st.fastUp===1)?600:7000,nd=$("#nd");
// paint win sector on gauge
const ring=$("#gring");
if(ring){const circ=2*Math.PI*90;ring.setAttribute("stroke-dasharray",(ch/100*circ).toFixed(1)+" "+circ);ring.style.transition="none"}
let last=-1;const t0=performance.now();
await new Promise(z=>{const f=n=>{const p=Math.min(1,(n-t0)/D),e=1-Math.pow(1-p,3.2),a=totA*e;if(nd)nd.setAttribute("transform",`rotate(${a} 110 110)`);const ix=Math.floor(a/8);if(ix!=last){last=ix;if(snd)tick()}p<1?requestAnimationFrame(f):z()};requestAnimationFrame(f)});
if(nd)nd.setAttribute("transform",`rotate(${totA} 110 110)`);
const srcNames=ids.map(i=>S[st.inv[i]][0]);
const spent=ids.reduce((x,i)=>x+S[st.inv[i]][1],0)+add;
// remove selected (high indices first)
[...ids].sort((a,b)=>b-a).forEach(i=>st.inv.splice(i,1));
if(add)st.bal-=add;
if(win)st.inv.push(t);
logH("Апгрейд "+ch+"%: "+srcNames.slice(0,3).join(", ")+(srcNames.length>3?"…":""),spent,win?S[t][1]:0,win?[t]:[],2);
win?st.s.uw++:st.s.ul++;
sel=new Set();up.add=0;up.tgt=-1;
save();
const wh=$("#wh");wh&&wh.classList.add(win?"won":"lost");
if(snd)(win?sndWin():sndLose());
document.body.insertAdjacentHTML("beforeend",`<div class="flash" style="--c:${win?"#2dff9a":"#ff5470"}"></div>`);
setTimeout(()=>{const e=$(".flash");e&&e.remove()},900);
const ur=$("#ur");
if(ur)ur.innerHTML=win?`<div class="rev" style="--c:#2dff9a"><h3>Успех!</h3><div class="grid rv"><div style="--d:0">${card(t)}</div></div></div>`:`<b class="lose">Не повезло: предметы сгорели.</b>`;
busy=0;hdr();
setTimeout(()=>{if(tab=="upgrade"&&!busy){const m=ur?ur.innerHTML:"";render();const u=$("#ur");if(u)u.innerHTML=m}},3200);
},
upPickIn(k){if(busy)return;if(sel.has(k))sel.delete(k);else{if(sel.size>=6)return toast("Максимум 6 предметов");sel.add(k)}render()},
upRm(k){if(busy)return;sel.delete(k);render()},
upPickTgt(k){if(busy)return;const ids=[...sel];const tot=ids.reduce((t,i)=>t+S[st.inv[i]][1],0)+(+up.add||0);if(ids.length&&S[+k][1]<=tot)return toast("Скин дешевле ставки — выбери дороже");up.tgt=+k;render()},
upForceCh(k){
  if(busy)return;
  k=+k; if(!(k>0))return;
  const ids=[...sel];
  if(!ids.length)return toast("Сначала выберите предметы слева");
  const base=ids.reduce((t,i)=>t+S[st.inv[i]][1],0);
  // (base+add)/target * 95 = k  => target = (base+add)*95/k
  // prefer adjust add on current target, else find target
  if(up.tgt>=0){
    const need=S[up.tgt][1]*k/95-base;
    if(need>=-0.01&&need<=st.bal){up.add=Math.max(0,+need.toFixed(2));render();toast("Шанс ≈ "+k+"%");return;}
  }
  const ideal=base*95/k;
  let best=-1,bd=1e99;
  S.forEach((s,i)=>{
    if(s[1]<=base)return;
    const need=s[1]*k/95-base;
    if(need>st.bal+0.01)return;
    const ch=Math.min(95,Math.max(0.01,+( (base+Math.max(0,need))/s[1]*95 ).toFixed(2)));
    const d=Math.abs(ch-k)+Math.abs(s[1]-ideal)*0.0001;
    if(d<bd){bd=d;best=i}
  });
  if(best<0){toast("Не хватает баланса для "+k+"%");return;}
  up.tgt=best;
  up.add=Math.max(0,Math.min(st.bal,+(S[best][1]*k/95-base).toFixed(2)));
  render();
  toast("Подобрано под "+k+"%");
},
upClr(){sel=new Set();up.tgt=-1;up.add=0;up.wantCh=0;render()},
upFilter(){up.fmin=+$("#fmin")?.value||0;up.fmax=+$("#fmax")?.value||0;render()},
upMode(){},
doCon(){const t=sum(),c=S.map((s,i)=>i).filter(i=>S[i][1]>=t*.6&&S[i][1]<=t*1.4),p=c.length?c:[S.map((s,i)=>i).filter(i=>S[i][1]<=t).pop()??0],w=p[R(p.length)];st.inv=st.inv.filter((_,i)=>!sel.has(i));st.inv.push(w);logH("Контракт: "+sel.size+" скинов",t,S[w][1],[w],2);sel=new Set();save();render();$("#res").innerHTML=`${card(w)}<b class="win">Контракт выполнен: ${S[w][0]}</b>`},
clrH(){st.hist=[];save();render()},
saveNick(){const v=$("#nick").value.trim().slice(0,20);if(!v)return toast("Введите ник");st.nm=v;save();render();toast("Ник сохранён")},
reset(){if(!rs){rs=1;render();setTimeout(()=>{rs=0;if(tab=="prof"&&!busy)render()},4000);return}rs=0;st={bal:500,inv:[],op:0,hist:[],s:{sp:0,wv:0,best:-1,uw:0,ul:0,bw:0,bl:0},nm:st.nm};save();render();toast("Прогресс сброшен")},
sellSel(){st.bal+=sum();st.inv=st.inv.filter((_,i)=>!sel.has(i));sel=new Set();save();render()},
sellAll(){st.bal+=st.inv.reduce((t,s)=>t+S[s][1],0);st.inv=[];sel=new Set();save();render()},
refill(){if(st.bal<50){st.bal+=1000;save();hdr();toast("Демо-баланс пополнен на $1000")}}};
document.addEventListener("keydown",e=>{if(e.key=="Escape"&&$("#ov"))A.close()});
document.addEventListener("change",e=>{if(e.target.id=="fastOpen"){st.fast=+e.target.checked;save()}if(e.target.id=="fastUp"){st.fastUp=+e.target.checked;save()}});
document.addEventListener("input",e=>{
if(e.target.id=="rng"){const el=$("#rv");if(el)el.textContent=e.target.value+"%"}
if(e.target.id=="upAdd"){up.add=+e.target.value||0;const v=$("#upAddV");if(v)v.textContent=fmt(up.add);
  // live update chance text
  const ids=[...sel], tot=ids.reduce((t,i)=>t+S[st.inv[i]][1],0)+up.add;
  if(up.tgt>=0&&tot>0){const ch=Math.min(95,Math.max(0.01,+(tot/S[up.tgt][1]*95).toFixed(2)));
    const g=$("#gval");if(g)g.textContent=(+ch).toFixed(2)+"%";
    const ring=$("#gring");if(ring){const circ=2*Math.PI*90;ring.setAttribute("stroke-dasharray",(ch/100*circ).toFixed(1)+" "+circ)}
    const b=$("#upb");if(b)b.disabled=!(ids.length&&up.tgt>=0&&ch>0);
  }
}
});
document.addEventListener("change",e=>{const id=e.target.id;if(id=="rng"||id=="cin"){up.c=Math.max(1,Math.min(90,Math.round(+e.target.value)||50));render()}});
document.addEventListener("click",e=>{const t=e.target.closest("[data-a]");if(t&&A[t.dataset.a])A[t.dataset.a](+t.dataset.k,t)});
render();
try{const l=JSON.parse(localStorage.getItem("dr"));if(l&&Array.isArray(l.inv)){st=norm(l);render()}}catch(e){}

</script>
</body>
